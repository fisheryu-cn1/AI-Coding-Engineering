="#000" font-size="13" textLength="403.933" font-weight="700">代码观察：submit() 原子执行 draft→pending→{approved,rejected}</text><text x="387.8" y="458.456" fill="#000" font-size="13" textLength="193.623">在 LoanOrderService.submit 中：</text><text x="387.8" y="474.808" fill="#000" font-size="13" textLength="222.479">① store.updateOrder(status='pending')</text><text x="387.8" y="491.159" fill="#000" font-size="13" textLength="188.595">② const result = autoApprove(id)</text><text x="387.8" y="507.511" fill="#000" font-size="13" textLength="254.344">③ store.updateOrder(status=result.decision)</text><text x="387.8" y="523.862" fill="#000" font-size="13" textLength="326.492">三步连续执行，无外部观测到中间 pending 状态的窗口。</text><text x="387.8" y="540.214" fill="#000" font-size="13" textLength="272.321">对调用方而言：POST /orders/:id/submit 的结果</text><text x="387.8" y="556.565" fill="#000" font-size="13" textLength="176.293">只会是 approved 或 rejected。</text><text x="387.8" y="572.917" fill="#000" font-size="13" textLength="349.216">pending 仅作为 OrderLog(action='submit') 的语义记录保留。</text></g><!--link *start* to draft--><g class="link" data-entity-1="ent0007" data-entity-2="ent0001" id="lnk8" data-source-line="13" data-link-type="dependency"><path d="M311.3,64.779 C311.3,89.279 311.3,151.849 311.3,188.389" style="stroke:#181818;stroke-width:1;" fill="none" id="*start*-to-draft"/><polygon points="311.3,193.389,315.3,184.389,311.3,188.389,307.3,184.389,311.3,193.389" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M316.3,99.609 L316.3,158.609 L599.3,158.609 L599.3,109.609 L589.3,99.609 L316.3,99.609" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M589.3,99.609 L589.3,109.609 L599.3,109.609 L589.3,99.609" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="322.3" y="118.104" fill="#000" font-size="13" textLength="262.26">POST /orders  (LoanOrderService.save 无 id)</text><text x="322.3" y="134.456" fill="#000" font-size="13" textLength="216.671">→ store.createOrder(..., status='draft')</text><text x="322.3" y="150.808" fill="#000" font-size="13" textLength="188.563">来源：loanOrderService.ts::save</text></g><!--link draft to pending--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk9" data-source-line="27" data-link-type="dependency"><path d="M311.3,243.609 C311.3,296.659 311.3,418.409 311.3,471.769" style="stroke:#181818;stroke-width:1;" fill="none" id="draft-to-pending"/><polygon points="311.3,476.769,315.3,467.769,311.3,471.769,307.3,467.769,311.3,476.769" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="473.183" y="288.104" fill="#000" font-size="13" textLength="46.947">submit()</text><path d="M316.3,296.961 L316.3,387.961 L676.3,387.961 L676.3,306.961 L666.3,296.961 L316.3,296.961" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M666.3,296.961 L666.3,306.961 L676.3,306.961 L666.3,296.961" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="322.3" y="315.456" fill="#000" font-size="13" textLength="166.175">LoanOrderService.submit(id)</text><text x="322.3" y="331.808" fill="#000" font-size="13" textLength="243.407">校验 canTransition(order.status, 'pending')</text><text x="322.3" y="348.159" fill="#000" font-size="13" textLength="207.67">store.updateOrder(status='pending')</text><text x="322.3" y="364.511" fill="#000" font-size="13" textLength="339.714">store.createLog(action='submit', '提交申请，进入自动审批')</text><text x="322.3" y="380.862" fill="#000" font-size="13" textLength="199.393">来源：loanOrderService.ts::submit</text></g><!--link pending to approved--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk10" data-source-line="36" data-link-type="dependency"><path d="M275.89,505.129 C215.5,510.699 93.9,531.679 40.3,610.609 C6,661.119 22.834,733.104 35.684,771.784" style="stroke:#181818;stroke-width:1;" fill="none" id="pending-to-approved"/><polygon points="37.26,776.529,38.219,766.727,35.684,771.784,30.627,769.249,37.26,776.529" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="172.883" y="625.104" fill="#000" font-size="13" textLength="232.68">autoApprove() [score >= passThreshold]</text><path d="M45.3,633.961 L45.3,741.961 L532.3,741.961 L532.3,643.961 L522.3,633.961 L45.3,633.961" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M522.3,633.961 L522.3,643.961 L532.3,643.961 L522.3,633.961" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="51.3" y="652.456" fill="#000" font-size="13" textLength="204.496">ScoringRules.autoApprove(orderId)</text><text x="51.3" y="668.808" fill="#000" font-size="13" textLength="151.296">decision = 'approved' 时：</text><text x="51.3" y="685.159" fill="#000" font-size="13" textLength="215.611">store.updateOrder(status='approved')</text><text x="51.3" y="701.511" fill="#000" font-size="13" textLength="292.944">store.createLog(action='approve', decisionReason)</text><text x="51.3" y="717.862" fill="#000" font-size="13" textLength="466.845">store.createCredit(approved_amount=order.amount, approved_rate=annualRate)</text><text x="51.3" y="734.214" fill="#000" font-size="13" textLength="175.576">来源：scoring.ts::autoApprove</text></g><!--link pending to rejected--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" id="lnk11" data-source-line="46" data-link-type="dependency"><path d="M321.51,527.369 C330.23,545.019 344.53,567.949 364.3,580.609 C431.5,623.629 486.32,552.789 541.3,610.609 C617.85,691.099 597.282,835.855 585.062,894.375" style="stroke:#181818;stroke-width:1;" fill="none" id="pending-to-rejected"/><polygon points="584.04,899.269,589.795,891.277,585.062,894.375,581.964,889.642,584.04,899.269" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="664.999" y="625.104" fill="#000" font-size="13" textLength="225.088">autoApprove() [score &lt;