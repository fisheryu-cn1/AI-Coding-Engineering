="30"><path d="M670.5,700.609 L670.5,792.367 A0,0 0 0 0 670.5,792.367 L1099.089,792.367 A0,0 0 0 0 1099.089,792.367 L1099.089,710.609 L1089.089,700.609 L889,700.609 L885,601.679 L881,700.609 L670.5,700.609 A0,0 0 0 0 670.5,700.609" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1089.089,700.609 L1089.089,710.609 L1099.089,710.609 L1089.089,700.609" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="676.5" y="719.104" fill="#000" font-size="13" textLength="407.589">@decision(双恢复路径(TA1-05,依 F-SV-02 第5步):暂停须区分成因——</text><text x="676.5" y="735.456" fill="#000" font-size="13" textLength="369.789">管理性暂停(F-LC-04 发布/暂停)可直连恢复;处置性暂停(F-LC-07/</text><text x="676.5" y="751.808" fill="#000" font-size="13" textLength="396.957">F-SV-02 依赖异常/阈值/结构变更处置)恢复须走重测 paused→testing;</text><text x="676.5" y="768.159" fill="#000" font-size="13" textLength="405.088">成因记录于 DisposalTodo。原"待需求方确认"标注撤销——03§6 第5步</text><text x="676.5" y="784.511" fill="#000" font-size="13" textLength="336.762">已明确"处置后触发重新试算+验收评估,通过方可重新发布")</text></g><g class="entity" data-qualified-name="GMN26" id="ent0027" data-source-line="37"><path d="M6,530.609 L6,622.367 A0,0 0 0 0 6,622.367 L431.663,622.367 A0,0 0 0 0 431.663,622.367 L431.663,540.609 L421.663,530.609 L318.64,530.609 L479.83,452.719 L310.64,530.609 L6,530.609 A0,0 0 0 0 6,530.609" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M421.663,530.609 L421.663,540.609 L431.663,540.609 L421.663,530.609" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="12" y="549.104" fill="#000" font-size="13" textLength="353.558">① 口径变更产生新版本(F-LC-04/F-SV-01-02):版本链上为新的</text><text x="12" y="565.456" fill="#000" font-size="13" textLength="293.268">版本个体,重走草稿→测试→发布,不在本图重复展开;</text><text x="12" y="581.808" fill="#000" font-size="13" textLength="177.69">重新上架同此(见 delisted 注记)</text><text x="12" y="598.159" fill="#000" font-size="13" textLength="359.887">② 运行期"服务降级/不可用(依赖异常)"为监控标记(MonitorFlag,</text><text x="12" y="614.511" fill="#000" font-size="13" textLength="404.663">R-MON-1 恢复后自动解除),非本状态机状态——见概念模型 @decision</text></g><!--link *start* to draft--><g class="link" data-entity-1="ent0006" data-entity-2="ent0001" id="lnk7" data-source-line="9" data-link-type="dependency"><path d="M1172,64.689 C1172,81.469 1172,112.829 1172,137.259" style="stroke:#181818;stroke-width:1;" fill="none" id="*start*-to-draft"/><polygon points="1172,142.259,1176,133.259,1172,137.259,1168,133.259,1172,142.259" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1173" y="109.104" fill="#000" font-size="13" textLength="296.125">创建(F-LC-01 定义/模板实例化/F-AI-01 建议转草稿)</text></g><!--link draft to testing--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk8" data-source-line="11" data-link-type="dependency"><path d="M1206.57,192.639 C1230.86,208.459 1264.65,228.439 1297,240.609 C1372.86,269.159 1461.067,283.48 1518.497,290.53" style="stroke:#181818;stroke-width:1;" fill="none" id="draft-to-testing"/><polygon points="1523.46,291.139,1515.014,286.073,1518.497,290.53,1514.04,294.013,1523.46,291.139" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1298" y="237.104" fill="#000" font-size="13" textLength="210.539">发起测试(F-LC-03 试算+有效性评估)</text></g><!--link testing to draft--><g class="link" data-entity-1="ent0002" data-entity-2="ent0001" id="lnk9" data-source-line="12" data-link-type="dependency"><path d="M1562.53,272.269 C1551.22,255.509 1533.93,234.249 1513,222.609 C1461.92,194.209 1295.784,178.145 1217.144,171.905" style="stroke:#181818;stroke-width:1;" fill="none" id="testing-to-draft"/><polygon points="1212.16,171.509,1220.815,176.209,1217.144,171.905,1221.448,168.234,1212.16,171.509" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1537" y="237.104" fill="#000" font-size="13" textLength="176.947">测试失败(F-LC-06 失败回草稿)</text></g><!-