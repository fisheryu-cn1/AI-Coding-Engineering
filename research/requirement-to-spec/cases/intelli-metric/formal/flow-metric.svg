th d="M6,696.609 L6,755.664 A0,0 0 0 0 6,755.664 L404.26,755.664 A0,0 0 0 0 404.26,755.664 L404.26,706.609 L394.26,696.609 L217.48,696.609 L242.87,597.619 L209.48,696.609 L6,696.609 A0,0 0 0 0 6,696.609" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M394.26,696.609 L394.26,706.609 L404.26,706.609 L394.26,696.609" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="12" y="715.104" fill="#000" font-size="13" textLength="377.26">@decision(paused→published 恢复的验证要求:F-LC-07"处置后需</text><text x="12" y="731.456" fill="#000" font-size="13" textLength="326.752">重新试算/测试验证方可恢复发布"——严格读应经 testing,</text><text x="12" y="747.808" fill="#000" font-size="13" textLength="202.941">本图按轻量恢复直连,待需求方确认)</text></g><g class="entity" data-qualified-name="GMN23" id="ent0024" data-source-line="31"><path d="M730,526.609 L730,618.367 A0,0 0 0 0 730,618.367 L1155.663,618.367 A0,0 0 0 0 1155.663,618.367 L1155.663,536.609 L1145.663,526.609 L798.05,526.609 L520.04,443.679 L790.05,526.609 L730,526.609 A0,0 0 0 0 730,526.609" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1145.663,526.609 L1145.663,536.609 L1155.663,536.609 L1145.663,526.609" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="736" y="545.104" fill="#000" font-size="13" textLength="353.558">① 口径变更产生新版本(F-LC-04/F-SV-01-02):版本链上为新的</text><text x="736" y="561.456" fill="#000" font-size="13" textLength="293.268">版本个体,重走草稿→测试→发布,不在本图重复展开;</text><text x="736" y="577.808" fill="#000" font-size="13" textLength="177.69">重新上架同此(见 delisted 注记)</text><text x="736" y="594.159" fill="#000" font-size="13" textLength="359.887">② 运行期"服务降级/不可用(依赖异常)"为监控标记(MonitorFlag,</text><text x="736" y="610.511" fill="#000" font-size="13" textLength="404.663">R-MON-1 恢复后自动解除),非本状态机状态——见概念模型 @decision</text></g><!--link *start* to draft--><g class="link" data-entity-1="ent0006" data-entity-2="ent0001" id="lnk7" data-source-line="9" data-link-type="dependency"><path d="M457,64.689 C457,81.469 457,112.82