            - approved
            - rejected
        decision_reason:
          type: string
        created_at:
          type: string
      required:
        - id
        - order_id
        - score
        - approved_amount
        - approved_rate
        - decision
        - decision_reason
    LOAN_PURPOSES:
      type: string
      enum:
        - "装修"
        - "教育"
        - "旅游"
        - "医疗"
    LoanOrder:
      type: object
      description: "由 backend/src/types.ts 自动提取"
      properties:
        id:
          type: number
        borrower_id:
          type: number
        amount:
          type: number
        term_months:
          type: number
        purpose:
          type: string
          enum:
            - "装修"
            - "教育"
            - "旅游"
            - "医疗"
        interest_rate:
          type: number
        status:
          $ref: "#/components/schemas/LoanStatus"
        created_at:
          type: string
      required:
