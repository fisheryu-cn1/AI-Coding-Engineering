      responses:
        '200':
          description: 成功（handle() 包装为 {code:0, data:<service-return>}，data 字段实际类型在运行时确定）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          description: 请求参数错误（来自 validate 中间件或状态机非法流转）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 资源不存在（来自 service 内 err.status = 404）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 服务器内部错误（来自 errorHandler）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    SuccessEnvelope:
      type: object
      description: |
        routes/index.ts 中 handle() 包装的成功响应：
        { code: 0, data: <service-return> }
        data 字段的实际类型由 services/*.ts 中各方法返回类型决定，
        脚本未做静态推导（避免编造），故标记 x-uncertain。
      properties:
        code:
          type: integer
          enum: [0]
        data:
          type: object
          additionalProperties: true
          x-uncertain: true
      required: [code, data]
    ErrorResponse:
      type: object
      description: |
        两类错误响应（来自代码，字段不完全一致）：
        1) validate/handle 路径：{ code: <number>, message: <string> }
        2) errorHandler 路径：{ success: false, message: <string> }
        故 code 与 success 均为可选。
      properties:
        code:
          type: integer
          description: 数字错误码（validate/handle 路径）
        success:
          type: boolean
          description: 失败标记（errorHandler 路径）
        message:
          type: string
      required: [message]
    ApprovalConfig:
      type: object
      description: "由 backend/src/types.ts 自动提取"
      properties:
        incomeWeight:
          type: number
        debtRatioLimit:
          type: number
        passThreshold:
          type: number
      required:
        - incomeWeight
        - debtRatioLimit
        - passThreshold
    Borrower:
      type: object
      description: "由 backend/src/types.ts 自动提取"
      properties:
        id:
          type: number
        name:
          type: string
        id_number:
          type: string
        phone:
          type: string
        income:
          type: number
        employer:
          type: string
        position:
          type: string
        created_at:
          type: string
      required:
        - id
        - name
        - id_number
        - phone
        - income
        - employer
        - position
    CreditResult:
      type: object
      description: "由 backend/src/types.ts 自动提取"
      properties:
        id:
          type: number
        order_id:
          type: number
        score:
          type: number
        approved_amount:
          type: number
        approved_rate:
          type: number
        decision:
          type: string
