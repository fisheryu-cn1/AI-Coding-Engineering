<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620">
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Microsoft JhengHei', 'SimHei', sans-serif; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
  </defs>
  <rect width="960" height="620" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-size="17" font-weight="600" fill="#111827">Agent 经 MCP 调用知识库的典型时序</text>
  <rect x="60" y="50" width="180" height="36" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="150" y="73" text-anchor="middle" font-size="13.5" font-weight="600" fill="#111827">AI Agent</text>
  <line x1="150" y1="86" x2="150" y2="520" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="390" y="50" width="180" height="36" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="480" y="73" text-anchor="middle" font-size="13.5" font-weight="600" fill="#111827">MCP 服务</text>
  <line x1="480" y1="86" x2="480" y2="520" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="720" y="50" width="180" height="36" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="810" y="73" text-anchor="middle" font-size="13.5" font-weight="600" fill="#111827">registry.sqlite</text>
  <line x1="810" y1="86" x2="810" y2="520" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="474" y="112" width="12" height="388" fill="#dbeafe" stroke="#bfdbfe"/>
  <line x1="150" y1="120" x2="474" y2="120" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="312.0" y="113" text-anchor="middle" font-size="11.5" fill="#374151">kb_search(query, mode="hybrid")</text>
  <line x1="486" y1="160" x2="810" y2="160" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="648.0" y="153" text-anchor="middle" font-size="11.5" fill="#374151">FTS + 结构导航检索</text>
  <line x1="474" y1="200" x2="150" y2="200" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-green)"/>
  <text x="312.0" y="193" text-anchor="middle" font-size="11.5" fill="#374151">hits[ doc_id · section_path · snippet · score ]</text>
  <line x1="150" y1="250" x2="474" y2="250" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="312.0" y="243" text-anchor="middle" font-size="11.5" fill="#374151">kb_show(doc_id)</text>
  <line x1="474" y1="290" x2="150" y2="290" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-green)"/>
  <text x="312.0" y="283" text-anchor="middle" font-size="11.5" fill="#374151">元数据 + 章节树 + 摘要</text>
  <line x1="150" y1="340" x2="474" y2="340" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="312.0" y="333" text-anchor="middle" font-size="11.5" fill="#374151">kb_read(doc_id, "§2 …")</text>
  <line x1="474" y1="380" x2="150" y2="380" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-green)"/>
  <text x="312.0" y="373" text-anchor="middle" font-size="11.5" fill="#374151">章节原文（$summary 读摘要全文）</text>
  <line x1="150" y1="430" x2="474" y2="430" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="312.0" y="423" text-anchor="middle" font-size="11.5" fill="#374151">kb_assemble_context(task, budget=8000)</text>
  <line x1="474" y1="470" x2="150" y2="470" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-green)"/>
  <text x="312.0" y="463" text-anchor="middle" font-size="11.5" fill="#374151">{ context_block, used, sources（溯源锚点）}</text>
  <rect x="150" y="540" width="660" height="56" rx="8" ry="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="480" y="562" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">统一错误结构（工具内捕获，不抛协议层异常）</text>
  <text x="480" y="582" text-anchor="middle" font-size="11.5" fill="#6b7280">{ error: { code, message, suggestion } } — DOC_NOT_FOUND / SECTION_NOT_FOUND / MODE_NOT_READY / CONFIG_INVALID / INTERNAL</text>
</svg>