[project]
name = "kbapp"
version = "0.1.0"
description = "GraphIt-KB: knowledge-graph-driven context management for AI coding agents"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "MIT"}
authors = [
    {name = "GraphIt-KB contributors"},
]
dependencies = [
    "typer>=0.17,<1",
    "rich>=13,<14",
    "pydantic>=2.7,<3",
    "pyyaml>=6,<7",
    "ulid-py>=1.1,<2",
]

[project.optional-dependencies]
# M3+ 才落地的 extras（声明保留，不安装/不调用，避免 fastmcp 教训复发）
embed = ["sentence-transformers>=3,<4", "torch>=2.4,<3"]  # M3 bge-m3
graph-ladybug = ["ladybug>=0.1,<1"]  # M5 图谱（单一选型，15 D15-10）
vector = ["lancedb>=0.20,<1", "pyarrow>=18,<20"]  # M3 向量
mcp = ["mcp>=1.29,<2"]  # M4 MCP 服务
# M2 parse/llm extras (09-M2 §1): 解析器与 LLM 客户端；缺省时 LLM 走纯规则降级（§7.4）。
# 用户决策：不走 Docling 重依赖，DOCX 用 python-docx 简单读取（不依赖版面分析）。
parse = [
  "pymupdf4llm>=1.28,<2",  # PDF 快路径（PyMuPDF/fitz 内置 OCR 关闭）
  "python-docx>=1.1,<2",   # DOCX 简单读取（按段落）
  "trafilatura>=2.2,<3",   # HTML 主路径
  "markdown-it-py>=4,<5",  # MD 标题树
  "pathspec>=0.12,<1",     # 扫描时遵循 .gitignore
]
llm = ["litellm>=1.96,<2"]  # §9；可选，缺省时分类走纯规则降级（§7.4）
dev = ["pytest>=9,<10", "pytest-cov>=6,<7", "ruff>=0.6,<1"]

[project.scripts]
kb = "kbapp.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kbapp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "integration: marks tests as integration (deselect with -m 'not integration')",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]