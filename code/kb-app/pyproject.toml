[project]
name = "kbapp"
version = "0.1.0"
description = "GraphIt-KB: knowledge-graph-driven context management for AI coding agents"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "MIT"}
authors = [
    {name = "GraphIt-KB contributors"},
]
dependencies = [
    "typer>=0.17,<1",
    "rich>=13,<14",
    "pydantic>=2.7,<3",
    "pyyaml>=6,<7",
    "ulid-py>=1.1,<2",
]

[project.optional-dependencies]
embed = ["sentence-transformers>=3,<4", "torch>=2.4,<3"]
graph-ladybug = ["ladybug>=0.1,<1"]
graph-kuzu = ["kuzu>=0.11.3,<3"]
vector = ["lancedb>=0.20,<1", "pyarrow>=18,<20"]
mcp = ["mcp>=1.29,<2", "fastmcp>=0.4,<1"]
dev = ["pytest>=9,<10", "pytest-cov>=6,<7", "ruff>=0.6,<1", "mypy>=1.11,<2"]

[project.scripts]
kb = "kbapp.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kbapp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "integration: marks tests as integration (deselect with -m 'not integration')",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]